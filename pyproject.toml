[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vigie"
version = "0.8.0"
description = "Compliance copilot for banks: cited answers on DORA, the AI Act, GDPR and AMLR."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
classifiers = ["License :: Other/Proprietary License", "Private :: Do Not Upload"]
authors = [
  { name = "Adam Beloucif", email = "adam.beloucif@efrei.net" },
  { name = "Emilien Morice", email = "emilien.morice@efrei.net" },
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "qdrant-client[fastembed]>=1.12",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "prometheus-client>=0.20",
  "numpy>=1.26",
  "requests>=2.32",
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
]

[project.optional-dependencies]
bench = [
  "gliner2[local]>=2.0",
  "transformers>=4.44,<5",
  "torch>=2.3",
  "presidio-analyzer>=2.2",
  "matplotlib>=3.8",
  "huggingface-hub>=0.24",
  "pyarrow>=15",
]
tracking = ["mlflow>=2.16"]
# Build-time only: fetch the guard classifier and quantize it (python -m vigie.guard.prepare).
guard-model = ["huggingface-hub>=0.24", "onnx>=1.16"]
quant = ["onnx>=1.16", "onnxruntime>=1.18"]
load = ["locust>=2.31"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-requests",
  "tomli>=2.0; python_version < '3.11'",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[project.scripts]
vigie-ingest = "vigie.corpus.cli:main"
vigie-eval = "vigie.evaluation.cli:main"
guardbench = "guardbench.cli:main"
vigie-drift = "vigie.drift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vigie", "src/guardbench"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["vigie", "guardbench", "scripts"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not integration'"
markers = ["integration: loads a real embedding model, slower than unit tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
