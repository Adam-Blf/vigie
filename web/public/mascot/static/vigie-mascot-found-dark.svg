<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160"><style>.lid{transform:scaleY(0)}.lid,.glass{transform-box:fill-box}@media (prefers-reduced-motion:no-preference){.owl{animation:nod .5s ease-out 2}@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}@keyframes breathe{50%{transform:scale(1.015)}}@keyframes lean{to{transform:rotate(-3deg)}}@keyframes sweep{from{translate:0 0;rotate:-6deg}to{translate:0 -3px;rotate:6deg}}@keyframes nod{50%{transform:translateY(4px)}}@keyframes shrug{40%{transform:translateY(-4px)}}@keyframes flash{50%{opacity:.55}}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}}</style><g class="owl"><g><path d="M44 58 L39 28 L63 45 Q80 39 97 45 L121 28 L116 58 Q127 82 122 110 Q115 147 80 148 Q45 147 38 110 Q33 82 44 58 Z" fill="#9fc4cb"/><circle cx="64" cy="72" r="17" fill="#17292d"/><path d="M56 75 Q64 64 72 75" fill="none" stroke="#9fc4cb" stroke-width="4" stroke-linecap="round"/><circle cx="96" cy="72" r="17" fill="#17292d"/><path d="M88 75 Q96 64 104 75" fill="none" stroke="#9fc4cb" stroke-width="4" stroke-linecap="round"/><path d="M75 85 L85 85 L80 95 Z" fill="#e0a25c"/><path d="M66 112 L72 117 L78 112 M82 112 L88 117 L94 112 M74 124 L80 129 L86 124" fill="none" stroke="#17292d" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/><rect x="66" y="144" width="10" height="6" rx="3" fill="#e0a25c"/><rect x="84" y="144" width="10" height="6" rx="3" fill="#e0a25c"/></g><g class="glass" transform="translate(102 108) rotate(12)"><rect x="0" y="-5" width="18" height="10" rx="2" fill="#e0a25c"/><rect x="16" y="-6.5" width="16" height="13" rx="2" fill="#e0a25c"/><rect x="30" y="-8" width="12" height="16" rx="2.5" fill="#e0a25c"/><rect x="40" y="-7" width="3" height="14" rx="1" fill="#9fc4cb" opacity="0.35"/></g></g></svg>
