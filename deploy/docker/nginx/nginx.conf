# Main configuration of the web image. Every file nginx writes lives under /tmp, so the
# container runs with a read-only root filesystem (k8s mounts /tmp and /var/cache/nginx).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types {
        application/manifest+json webmanifest;
    }

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # No client address in the access log: the audit trail of brief 11.10 keeps no IP,
    # the web tier has no reason to keep one either.
    log_format vigie '[$time_local] "$request" $status $body_bytes_sent $request_time';
    access_log /dev/stdout vigie;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json;

    # Rendered at start-up from templates/vigie/default.conf.template, see the Dockerfile.
    include /tmp/vigie/*.conf;
}
