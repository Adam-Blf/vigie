# The PWA, served by an unprivileged nginx on 8080. nginx writes its pid and temp files,
# so those two paths get small in-memory volumes and the image itself stays read-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigie-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vigie-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vigie-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/adam-blf/vigie-web
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vigie-web
spec:
  selector:
    app.kubernetes.io/name: vigie-web
  ports:
    - name: http
      port: 8080
      targetPort: http
