# Pod Security "restricted" is enforced, not only audited: a pod that runs as root or
# keeps a capability is refused at admission, whoever applies it.
apiVersion: v1
kind: Namespace
metadata:
  name: vigie
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
