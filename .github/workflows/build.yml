name: build

# Image publication is the whole of the CD on the GitHub side. Flux, inside the cluster,
# watches GHCR and rolls the new tag out (docs/cicd.md): no cluster credential ever lives here.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # Never cancel a publication halfway: a pushed but unsigned image would be left behind.
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing asks GitHub for an OIDC token bound to this workflow run.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    env:
      IMAGE: ghcr.io/adam-blf/vigie-${{ matrix.component }}
      DOCKERFILE: deploy/docker/${{ matrix.component }}.Dockerfile
      TRIVY_VERSION: v0.70.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dockerfile present
        id: present
        run: |
          if [ -f "$DOCKERFILE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$DOCKERFILE does not exist yet, nothing to publish"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.present.outputs.found == 'true'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.present.outputs.found == 'true'

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        if: steps.present.outputs.found == 'true'
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          # The full commit SHA is the reference tag. The main-<timestamp>-<sha> tag only
          # exists so that a Flux ImagePolicy can sort builds, a bare SHA has no order.
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=main-{{date 'YYYYMMDDHHmmss' tz='UTC'}}-{{sha}},enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # Trivy reads a local amd64 build before anything is pushed: an image with a fixable
      # CRITICAL or HIGH vulnerability never reaches the registry, so Flux never sees it.
      - name: Build for the scan
        if: steps.present.outputs.found == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          load: true
          push: false
          tags: vigie-${{ matrix.component }}:scan
          cache-from: type=gha,scope=${{ matrix.component }}

      # v0.36.0 is an immutable release published after the March 2026 tag hijack of this
      # repository, and it installs a Trivy version later than the compromised 0.69.4.
      - name: Trivy, blocking on fixable CRITICAL and HIGH
        if: steps.present.outputs.found == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: vigie-${{ matrix.component }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          format: table
          version: ${{ env.TRIVY_VERSION }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.present.outputs.found == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 and linux/arm64
        if: steps.present.outputs.found == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: SBOM (CycloneDX)
        if: steps.present.outputs.found == 'true'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.component }}.cdx.json
          artifact-name: sbom-${{ matrix.component }}.cdx.json
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.present.outputs.found == 'true'

      # Signing the digest, never a tag: a tag can be moved after the fact, a digest cannot.
      - name: Sign the image and attest its SBOM (keyless)
        if: steps.present.outputs.found == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          COMPONENT: ${{ matrix.component }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --type cyclonedx \
            --predicate "sbom-${COMPONENT}.cdx.json" "${IMAGE}@${DIGEST}"
          echo "### ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
