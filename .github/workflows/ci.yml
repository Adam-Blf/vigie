name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv venv && uv pip install -e ".[dev]"
      - name: Ruff
        run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - name: Mypy
        run: uv run --no-sync mypy src
      - name: Pytest
        run: uv run --no-sync pytest --cov=src --cov-report=term-missing
