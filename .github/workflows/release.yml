name: release

# Images are published, signed and scanned by build.yml, which also runs on version tags.
# Publishing them here too would push the same tags twice, the second push unsigned.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Check tag against pyproject and extract notes
        run: python -m scripts.release_notes "${GITHUB_REF_NAME}" --verify-tag > release-notes.md
      - name: Build wheel and sdist
        run: uv build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "Vigie ${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag
