version: 2

# Weekly, grouped, and a week of cooldown: a freshly published release is where a hijacked
# package usually shows up, waiting a few days lets the ecosystem notice first.

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /redteam
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    # The composite action under .github/actions pins setup-uv too.
    directories: [/, /.github/actions/python-env]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
