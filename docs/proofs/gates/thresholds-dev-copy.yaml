# Evaluation floors, written on 2026-10-02 before the first measurement.
#
# These numbers come from the project brief (section 11.3), not from a run. Lowering one is
# a decision of the project owner recorded in an ADR, never a fix for a red gate. Published
# figures are computed on the sealed test split only (data/golden/test.sha256).

version: 1
split: dev

retrieval:
  k: 5
  recall_at_k_min: 0.80
  mrr_min: 0.60

citations:
  # Citations left in the final answer that point outside the retrieved passages.
  invented_in_final_answer_max: 0
  precision_min: 0.85
  coverage_min: 0.80

refusal:
  # At least 9 correct refusals out of 10 out-of-scope questions. Measured on all 10
  # out-of-scope rows, dev and test, not on the test split alone (see data/golden/README.md).
  correct_refusal_rate_min: 0.90

# Relative gate, added on top of the floors: compared with the current champion, recall@k
# and raw citation validity may not drop by more than this many points (0.02 = 2 points).
regression:
  max_drop: 0.02
  metrics:
    - recall_at_k
    - raw_citation_validity

# J12, written on 2026-10-06 before the first quantization measurement. The int8 embedding
# model replaces the fp32 one only if both hold on the dev split: recall@5 drops by at most
# max_recall_drop (0.02 = 2 points) and the model file is at most max_size_ratio of the fp32
# file (0.5 = at least halved). The test split is never used for this decision.
quantization:
  split: dev
  k: 5
  max_recall_drop: 0.02
  max_size_ratio: 0.5

bootstrap:
  draws: 1000
  seed: 20261002
  confidence: 0.95

# Load test thresholds (J11), written before the first real measurement. They come from
# the local load targets of the project brief, not from a run. The runtime reads them
# through Settings (VIGIE_LOAD_*), whose defaults must stay equal to the values below:
# tests/loadtest/test_load_thresholds_file.py fails the build when they drift.
load:
  # p95 of POST /v1/ask on the answering path, attacks excluded. Strictly below.
  p95_ms: 500
  # Failed requests over all requests, attacks included. Strictly below.
  max_error_ratio: 0.01
  # Injections the input guard let through, over judged attacks. At most. Complement of
  # the 0.90 guard recall floor.
  max_attack_leak_ratio: 0.10
  # Users allowed against any host that is not this machine. A code constant, not a
  # setting: see src/vigie/loadtest/guard.py.
  remote_max_users: 8

# Production input guard (J4), written on 2026-10-06 before its first measurement. Values
# from section 11.3 of the project brief, measured on the test split of data/seed.jsonl
# by python -m vigie.guard.measure, through the same normalization as the API.
guard:
  # Direct injections caught, per language (fr, en) and overall. At least.
  direct_injection_recall_min: 0.90
  # Plain legitimate questions blocked. At most.
  benign_fpr_max: 0.02
  # Legitimate questions that look like attacks ("comment ignorer un test"). At most.
  benign_tricky_fpr_max: 0.10
  # 95th percentile of the whole input chain, normalization included. Strictly below.
  p95_ms: 200
