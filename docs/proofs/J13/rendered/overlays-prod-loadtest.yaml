apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/part-of: vigie
  name: qdrant-snapshot
  namespace: vigie
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: qdrant-snapshot
        spec:
          automountServiceAccountToken: false
          containers:
          - args:
            - |
              api=http://qdrant:6333
              # Older snapshots were uploaded already or are superseded by this one,
              # and Qdrant keeps them on a size-limited volume.
              for old in $(curl -fsS -H "api-key: ${QDRANT_API_KEY}" "${api}/snapshots" \
                | grep -o '"name":"[^"]*"' | cut -d'"' -f4); do
                curl -fsS -X DELETE -H "api-key: ${QDRANT_API_KEY}" "${api}/snapshots/${old}" >/dev/null
              done
              name=$(curl -fsS -X POST -H "api-key: ${QDRANT_API_KEY}" "${api}/snapshots?wait=true" \
                | sed -n 's/.*"name":"\([^"]*\)".*/\1/p')
              test -n "${name}"
              echo "snapshot ${name} created"
              if [ -z "${PAR_URL}" ]; then
                echo "no vigie-backup secret, snapshot kept in Qdrant only"
                exit 0
              fi
              curl -fsS -H "api-key: ${QDRANT_API_KEY}" -o "/tmp/${name}" "${api}/snapshots/${name}"
              curl -fsS -X PUT --upload-file "/tmp/${name}" "${PAR_URL}qdrant/${name}"
              echo "snapshot ${name} uploaded"
            command:
            - sh
            - -ec
            env:
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  key: qdrant-api-key
                  name: vigie-secrets
            - name: PAR_URL
              valueFrom:
                secretKeyRef:
                  key: par-url
                  name: vigie-backup
                  optional: true
            image: docker.io/curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
            name: snapshot
            resources:
              limits:
                memory: 32Mi
              requests:
                cpu: 10m
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /tmp
              name: tmp
          restartPolicy: OnFailure
          securityContext:
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - emptyDir:
              sizeLimit: 2Gi
            name: tmp
  schedule: 17 3 * * *
  successfulJobsHistoryLimit: 2
  timeZone: Europe/Paris
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  labels:
    app.kubernetes.io/part-of: vigie
  name: vigie-canary
  namespace: vigie
spec:
  args:
  - name: canary-hash
  - name: stable-hash
  - name: prometheus
    value: http://prometheus.vigie.svc.cluster.local:9090
  - name: window
    value: 2m
  - name: min-requests
    value: "30"
  metrics:
  - count: 4
    failureCondition: len(result) > 0 && result[0] >= 0.01
    failureLimit: 1
    inconclusiveLimit: 2
    initialDelay: 30s
    interval: 15s
    name: error-rate
    provider:
      prometheus:
        address: '{{args.prometheus}}'
        query: |
          clamp_min(
            (sum(rate(vigie_requests_total{route="/v1/ask", status=~"5..", rollouts_pod_template_hash="{{args.canary-hash}}"}[{{args.window}}])) or vector(0))
            - (sum(rate(vigie_llm_errors_total{rollouts_pod_template_hash="{{args.canary-hash}}"}[{{args.window}}])) or vector(0)),
            0
          )
          / sum(rate(vigie_requests_total{route="/v1/ask", rollouts_pod_template_hash="{{args.canary-hash}}"}[{{args.window}}]))
          and on() sum(increase(vigie_requests_total{route="/v1/ask", rollouts_pod_template_hash="{{args.canary-hash}}"}[{{args.window}}])) >= {{args.min-requests}}
    successCondition: len(result) > 0 && result[0] < 0.01
  - count: 4
    failureCondition: len(result) > 0 && result[0] >= 1.5
    failureLimit: 1
    inconclusiveLimit: 2
    initialDelay: 30s
    interval: 15s
    name: latency-p95-ratio
    provider:
      prometheus:
        address: '{{args.prometheus}}'
        query: |
          histogram_quantile(0.95, sum by (le) (rate(vigie_request_latency_seconds_bucket{route="/v1/ask", rollouts_pod_template_hash="{{args.canary-hash}}"}[{{args.window}}])))
          / histogram_quantile(0.95, sum by (le) (rate(vigie_request_latency_seconds_bucket{route="/v1/ask", rollouts_pod_template_hash="{{args.stable-hash}}"}[{{args.window}}])))
          and on() sum(increase(vigie_requests_total{route="/v1/ask", rollouts_pod_template_hash="{{args.canary-hash}}"}[{{args.window}}])) >= {{args.min-requests}}
    successCondition: len(result) > 0 && result[0] < 1.5
  - count: 4
    failureCondition: len(result) > 0 && result[0] >= 3
    failureLimit: 1
    inconclusiveLimit: 2
    initialDelay: 30s
    interval: 15s
    name: blocked-rate-ratio
    provider:
      prometheus:
        address: '{{args.prometheus}}'
        query: |
          (
            (sum(rate(vigie_blocked_total{rollouts_pod_template_hash="{{args.canary-hash}}"}[{{args.window}}])) or vector(0))
            / sum(rate(vigie_requests_total{route="/v1/ask", rollouts_pod_template_hash="{{args.canary-hash}}"}[{{args.window}}]))
          )
          / clamp_min(
            (sum(rate(vigie_blocked_total{rollouts_pod_template_hash="{{args.stable-hash}}"}[{{args.window}}])) or vector(0))
            / sum(rate(vigie_requests_total{route="/v1/ask", rollouts_pod_template_hash="{{args.stable-hash}}"}[{{args.window}}])),
            0.01
          )
          and on() sum(increase(vigie_requests_total{route="/v1/ask", rollouts_pod_template_hash="{{args.canary-hash}}"}[{{args.window}}])) >= {{args.min-requests}}
    successCondition: len(result) > 0 && result[0] < 3
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  labels:
    app.kubernetes.io/part-of: vigie
  name: vigie-api
  namespace: vigie
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: vigie-api
  strategy:
    canary:
      abortScaleDownDelaySeconds: 30
      canaryService: vigie-api-canary
      stableService: vigie-api-stable
      steps:
      - setCanaryScale:
          replicas: 1
      - setWeight: 10
      - pause:
          duration: 45s
      - analysis:
          args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
          - name: stable-hash
            valueFrom:
              podTemplateHashValue: Stable
          templates:
          - templateName: vigie-canary
      - setWeight: 50
      - pause:
          duration: 45s
      - analysis:
          args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
          - name: stable-hash
            valueFrom:
              podTemplateHashValue: Stable
          templates:
          - templateName: vigie-canary
      - setWeight: 100
      trafficRouting:
        traefik:
          weightedTraefikServiceName: vigie-api-weighted
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9711"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: vigie-api
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: VIGIE_QDRANT_API_KEY
          valueFrom:
            secretKeyRef:
              key: qdrant-api-key
              name: vigie-secrets
        envFrom:
        - configMapRef:
            name: vigie-api-config-bcfmfd8khh
        - configMapRef:
            name: vigie-bundle-88kth5bh88
        image: ghcr.io/adam-blf/vigie-api:main-0000000-0
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
        name: api
        ports:
        - containerPort: 8710
          name: http
        - containerPort: 9711
          name: metrics
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
        resources:
          limits:
            memory: 640Mi
          requests:
            cpu: 100m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 36
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vigie-api-data
      - emptyDir:
          sizeLimit: 512Mi
        name: tmp
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    app.kubernetes.io/part-of: vigie
  name: vigie-api
  namespace: vigie
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
  maxReplicas: 3
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
