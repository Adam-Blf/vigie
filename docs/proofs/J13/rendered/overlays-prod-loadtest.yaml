        envFrom:
        - configMapRef:
            name: vigie-api-config-bcfmfd8khh
        - configMapRef:
            name: vigie-bundle-88kth5bh88
        image: ghcr.io/adam-blf/vigie-api:main-0000000-0
        name: ingest
        resources:
          limits:
            memory: 768Mi
          requests:
            cpu: 200m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /work
