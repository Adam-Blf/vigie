apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
  labels:
    app.kubernetes.io/part-of: vigie
  name: ollama-pull
  namespace: vigie
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-pull
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - 'curl --fail --silent --show-error --max-time 3600 http://ollama:11434/api/pull
          -d "{\"model\": \"${MODEL}\", \"stream\": false}"'
        command:
        - sh
        - -c
        env:
        - name: MODEL
          valueFrom:
            configMapKeyRef:
              key: VIGIE_OLLAMA_MODEL
              name: vigie-bundle-88kth5bh88
        image: docker.io/curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
        name: pull
        resources:
          limits:
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
  ttlSecondsAfterFinished: 3600
